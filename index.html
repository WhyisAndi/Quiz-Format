<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1f;--bg2:#121838;--panel:#151c3f;--panel2:#1b2350;--line:#2a3366;--text:#eef1ff;--muted:#9aa3d0;--gold:#ffc83d;--good:#2ee59d;--bad:#ff4d6d;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#28316c;color:var(--text);font-weight:600;transition:filter .12s,transform .06s}
button:hover{filter:brightness(1.18)}button:active{transform:translateY(1px)}
button:disabled{opacity:.38;cursor:not-allowed;filter:none;transform:none}
.b-gold{background:var(--gold);color:#1d1500}.b-good{background:var(--good);color:#00281a}.b-bad{background:var(--bad);color:#fff}.b-ghost{background:transparent;border:1px solid var(--line)}
.b-big{font-size:20px;padding:14px 22px;border-radius:14px}
input,textarea,select{font:inherit;background:#0c1130;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:360px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical}
a{color:var(--gold)}
.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h1,h2,h3{margin:0 0 10px;line-height:1.1}h2{font-size:18px}h3{font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel2);font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}.dot.on{background:var(--good)}
.hrt{color:#ff3b5c;font-size:1em;margin-right:1px}.hrt.lost{color:#ffffff30}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:12px;z-index:99;display:none;max-width:90vw}

/* landing */
.landing{max-width:520px;margin:10vh auto;padding:16px}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:56px;letter-spacing:.02em}.logo span{color:var(--gold)}

/* host */
.host header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
.host .code{font-weight:800;font-size:26px;letter-spacing:.12em;color:var(--gold)}
.hgrid{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:900px){.hgrid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:var(--panel)}.tabs button.on{background:var(--gold);color:#1d1500}
.plist{display:flex;flex-direction:column;gap:6px}
.guard{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.guard button{padding:6px 10px;font-size:13px}
.pendbox{background:#3a3110;border:1px solid var(--gold);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.pendbox .prow button{padding:5px 9px;font-size:12px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 9px;border-left:5px solid var(--tc,#444)}
.prow .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow button{padding:4px 8px;font-size:12px;border-radius:7px}
.tbtn{background:#0c1130;border:1px solid var(--tc)}.tbtn.on{background:var(--tc);color:#000}
.teamed{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 40px;gap:6px;align-items:center;margin-bottom:6px}.teamed input{min-width:0;width:100%}
.teamed input[type=color]{padding:0;height:36px;width:40px}
.ctrl{display:flex;flex-direction:column;gap:14px}
.qbox{background:#0c1130;border-radius:12px;padding:14px 16px;font-size:22px;font-weight:600}
.ans{color:var(--good);font-size:18px;margin-top:6px}
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hcard{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 10px}
.hcard.rev{background:#183a33}.hcard .t{flex:1}.hcard .pts{font-weight:800;color:var(--gold)}
.phase{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.jgrid{display:grid;gap:6px}.jgrid .jc{background:#1d2a8a;color:var(--gold);font-weight:800;font-size:18px;padding:12px 0}.jgrid .jc.used{background:#11163a;color:#ffffff22}
.jgrid .jh{font-size:12px;font-weight:800;text-transform:uppercase;text-align:center;padding:6px 2px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:6px}
.edcard{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.edcard input,.edrow input{min-width:0}
.edno{min-width:26px;color:var(--gold)}.edq{font-weight:600}
.edanswers{display:flex;flex-direction:column;gap:6px;padding-left:34px}
.edans{flex-wrap:nowrap}.edrank{width:24px;color:var(--muted)}.edpts{width:40px;text-align:right;color:var(--gold);font-weight:800}
.edans button,.edcard .row>button,.edrow button{padding:6px 10px}
.edtable{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.edrow{flex-wrap:nowrap}.edrow .eda{width:30%}
.edjeo{display:grid;gap:10px;margin:10px 0}
.edcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.edcat{font-weight:800;text-align:center;background:#1d2a8a}
.edjcard{background:var(--panel2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px}
.edjcard textarea{min-height:0;font-family:inherit;font-size:13px;padding:6px 8px;resize:vertical}
.edjcard input{font-size:13px;padding:6px 8px;min-width:0}
.edval{font-weight:800;color:var(--gold);font-size:15px}
.edimport{margin:14px 0 6px;background:var(--panel2);border-radius:12px;padding:10px 12px}.edimport summary{cursor:pointer;font-weight:600}
.help p,.help li{line-height:1.55;color:#d7dcf5}.help code{background:#0c1130;padding:1px 6px;border-radius:6px}

/* ===== Spieler-Seite ===== */
body.pl{overflow:hidden}
.plwrap{position:fixed;inset:0;display:flex;flex-direction:column;background:#07050f}
.plstage{flex:1;position:relative;min-height:0}
.pbar{height:124px;flex:none;display:flex;align-items:center;gap:18px;padding:0 20px;background:#0f0a22;border-top:2px solid #3a2670}
.pbar .me{display:flex;flex-direction:column;gap:5px;min-width:200px}
.pbar .me b{font-size:20px}
.pbar .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px 10px;flex-wrap:wrap;min-width:0}
.pbar .msg{font-size:22px;font-weight:700;text-align:center}
.pbar .side{display:flex;align-items:center;gap:12px}
.bigbuzz{font-family:'Bebas Neue',Impact,sans-serif;font-size:50px;letter-spacing:.06em;padding:8px 64px 4px;border-radius:16px;background:linear-gradient(180deg,#ffffff38,#00000040),var(--tc,#e11d48);color:#fff;box-shadow:0 7px 0 #0008,0 0 30px var(--tc);animation:bpulse 1s infinite;text-shadow:0 3px 0 #0006}
.bigbuzz:disabled{animation:none;box-shadow:none}
@keyframes bpulse{50%{box-shadow:0 7px 0 #0008,0 0 70px var(--tc)}}
.vchip{padding:9px 16px;font-size:17px;border:2px solid transparent}.vchip.on{border-color:var(--gold);background:#3a3110}
.campop{position:fixed;right:16px;bottom:140px;width:400px;z-index:20;transition:transform .25s,opacity .25s}
.campop.hide{transform:translateY(24px);opacity:0;pointer-events:none}
.campop iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;margin-top:10px}
input[type=range]{padding:0;accent-color:var(--gold)}
.okbadge{display:inline-block;margin-top:10px;font-size:30px;padding:4px 18px;border-radius:12px}
.okbadge.y{background:var(--good);color:#00281a}.okbadge.n{background:var(--bad);color:#fff}

/* ===== Bühne (Overlay + Spieler-Ansicht) ===== */
body.ov{overflow:hidden;background:transparent}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:#fff;font-family:'Poppins',system-ui,sans-serif}
.stage.bg{background:radial-gradient(1000px 700px at 50% 45%,#2b1556 0,#150b2e 55%,#09060f 100%)}
.stage.bg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff10 1px,transparent 1.3px);background-size:7px 7px}
.stage .layer{position:absolute;inset:0}
.stage .ui,.stage .fx{pointer-events:none}
.stage .click{pointer-events:auto;cursor:pointer}
.disp{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em}
.camwrap{position:absolute;overflow:hidden;border-radius:9px;background:#000}
.camwrap iframe{width:100%;height:100%;border:0;display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}
@keyframes slotin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes zoomin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
/* Slots */
.slot{position:relative;transform-origin:0 0}
.cam{position:relative;aspect-ratio:16/9;border-radius:9px;box-shadow:inset 0 0 0 3px var(--sc),0 0 22px #0009;transition:box-shadow .3s}
.cam.nocam{background:linear-gradient(160deg,#2c2160,#140c30)}
.cam .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;color:#ffffff1c}
.npill{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#ffffff30,#00000030),var(--sc);border-radius:99px;padding:3px 16px 3px 3px;font-weight:700;font-size:19px;box-shadow:0 3px 10px #000a;white-space:nowrap;max-width:94%;text-shadow:0 1px 2px #0008}
.npill .av{width:28px;height:28px;border-radius:50%;background:#0007;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.npill .nm{overflow:hidden;text-overflow:ellipsis}
.npill .hearts{font-size:19px;margin-left:4px;letter-spacing:1px}
.slot.hot .cam,.slot.turn .cam,.slot.mine .cam{box-shadow:inset 0 0 0 6px var(--gold),0 0 40px #ffc83daa}
.slot.hit .cam{box-shadow:inset 0 0 0 6px var(--bad),0 0 50px var(--bad);animation:shake .5s 2}
.slot.win .cam{box-shadow:inset 0 0 0 7px var(--gold),0 0 80px var(--gold)}
.slot.dim{opacity:.4}
.slot.click:hover .cam{box-shadow:inset 0 0 0 6px #fff,0 0 30px #fff8}
.slot.an{animation:slotin .5s cubic-bezier(.2,.9,.3,1.2) var(--ad,0s) both}
.sbadge{position:absolute;top:-16px;right:-12px;background:var(--gold);color:#1d1500;font-size:40px;min-width:58px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:center;padding:4px 14px 0;box-shadow:0 4px 14px #000a;line-height:1}
.sbadge.an{animation:pop .5s var(--ad,0s) both}
.stag.low{top:auto;bottom:52px}
.stag{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1d1500;font-weight:800;font-size:15px;padding:3px 12px;border-radius:7px;letter-spacing:.08em;white-space:nowrap}
.ansbox{position:absolute;top:8px;left:8px;right:8px;background:#000c;border-radius:8px;padding:6px 10px;font-size:15px;line-height:1.35}
.ansbox div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .hrt{display:inline-block;color:#ff3b5c;margin:0}.stage .hrt.lost{color:#ffffff2e}
.stage .hrt.lost.an{animation:hbreak 1.2s var(--ad,0s) both}
@keyframes hbreak{0%{color:#ff3b5c;transform:scale(1)}25%{color:#ff3b5c;transform:scale(2.1) rotate(-14deg)}50%{color:#fff;transform:scale(1.6) rotate(16deg)}100%{color:#ffffff2e;transform:scale(1)}}
/* Team-Panels */
.tpanel{position:absolute;top:26px;bottom:26px;width:430px;border:2px solid #5a3aa6;border-radius:10px;background:#0d0820d9;padding:10px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 40px #5a3aa633;transition:border-color .3s,box-shadow .3s}
.tpanel.l{left:40px}.tpanel.r{right:40px}
.tpanel.active{border-color:var(--gold);box-shadow:0 0 60px #ffc83d55}
.thead{border:2px solid #5a3aa6;border-radius:8px;padding:8px;background:#120b2a}
.tban{background:linear-gradient(180deg,#ffffff38,#00000045),var(--tc);border-radius:6px;text-align:center;font-size:50px;line-height:1;padding:10px 8px 4px;text-shadow:0 3px 0 #0007;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.tpts{text-align:center;font-size:72px;line-height:1;margin:10px 0 6px}.tpts small{font-size:32px;color:var(--tc);margin-left:6px;filter:brightness(1.4)}
.trow{display:flex;justify-content:space-between;align-items:center;background:#0a0618;border:1px solid #3a2670;border-radius:6px;padding:6px 10px;min-height:42px}
.tstat{background:#2a2245;border-radius:99px;padding:3px 14px;font-size:15px;font-weight:700;letter-spacing:.08em;color:#c9c2e6;text-transform:uppercase}
.tstat.on{background:var(--gold);color:#1d1500}
.tstat.an{animation:pop .4s var(--ad,0s) both}
.tlives{font-size:13px;font-weight:700;letter-spacing:.08em;color:#c9c2e6;display:flex;align-items:center;gap:6px}
.tlives .hrt{font-size:24px}
.tslots{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:10px;min-height:0}
/* Mitte */
.center{position:absolute;left:500px;right:500px;top:26px;bottom:26px;display:flex;flex-direction:column;gap:14px}
.hostslot{width:430px;align-self:center;flex:none}
.logo2{display:flex;flex-direction:column;align-items:center;transform:rotate(-4deg)}
.logo2 .a,.logo2 .b{text-shadow:5px 5px 0 #07040f,-5px 5px 0 #07040f,5px -5px 0 #07040f,-5px -5px 0 #07040f,0 6px 0 #07040f,6px 0 0 #07040f,-6px 0 0 #07040f,0 14px 0 #07040f}
.logo2 .a{font-size:170px;line-height:.85;color:#fff}
.logo2 .b{font-size:140px;line-height:.85;font-style:italic;color:#b388ff;margin-top:2px;transform:skewX(-8deg)}
.logo2.sm .a{font-size:110px}.logo2.sm .b{font-size:90px}
.lobbycenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lobbycenter .ns{font-size:58px;color:#ff3b5c;margin-top:36px;line-height:1;white-space:nowrap;text-align:center}
.lobbycenter .wt{font-size:22px;font-weight:600}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #ff3b5c33;border-top-color:#ff3b5c;animation:spin 1s linear infinite;margin-top:8px}
.lobbygrid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:30px}
.lgrid{display:grid;gap:24px;justify-content:center}
.qbar{background:#0d0820e6;border:2px solid #5a3aa6;border-radius:12px;padding:16px 26px;font-size:34px;font-weight:700;text-align:center;line-height:1.25;flex:none}
.qbar.an{animation:pop .45s var(--ad,0s) both}
.qmeta{font-size:30px;color:var(--gold);text-align:center;line-height:1;flex:none}
/* Team-Duell */
.fboard{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),1fr);gap:12px;min-height:0}
.fcard{perspective:1400px;position:relative}
.fin{position:absolute;inset:0;transform-style:preserve-3d}
.fcard.rev .fin{transform:rotateX(180deg)}
.fcard.rev.an .fin{animation:flipx .9s cubic-bezier(.3,1.35,.5,1) var(--ad,0s) both}
@keyframes flipx{from{transform:rotateX(0)}to{transform:rotateX(180deg)}}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;align-items:center}
.ff{justify-content:center;background:linear-gradient(180deg,#3b2a8f,#22165a);border:2px solid #7c5cff66;box-shadow:inset 0 0 30px #0006}
.ff .rk{width:66px;height:66px;border-radius:50%;background:#0d0820;border:2px solid #7c5cff;display:flex;align-items:center;justify-content:center;font-size:44px;padding-top:5px}
.fb{transform:rotateX(180deg);background:linear-gradient(180deg,#ffd75e,#f0a70c);color:#2a1a00;justify-content:space-between;padding:0 22px;gap:12px}
.fb .tx{font-size:30px;font-weight:800;line-height:1.1}
.fb .pt{font-size:46px;background:#2a1a00;color:var(--gold);border-radius:10px;padding:4px 14px 0;line-height:1.05}
.fstat{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;min-height:66px}
.pot{background:#0d0820e6;border:2px solid #5a3aa6;border-radius:12px;padding:6px 20px 2px;font-size:32px}.pot b{color:var(--gold);font-size:46px;margin-left:8px;font-weight:400}
.strikes{display:flex;gap:10px}.strk{width:58px;height:58px;border-radius:10px;border:3px solid #ffffff25;display:flex;align-items:center;justify-content:center;font-size:42px;color:transparent;font-weight:800}
.strk.on{border-color:var(--bad);color:var(--bad);background:#ff4d6d22}
.strk.on.an{animation:pop .4s var(--ad,0s) both}
.banner{background:var(--gold);color:#1d1500;font-size:38px;padding:6px 28px 2px;border-radius:12px;box-shadow:0 8px 30px #0009;text-align:center;white-space:nowrap;align-self:center}
.banner.t{background:linear-gradient(180deg,#ffffff38,#00000040),var(--tc);color:#fff;text-shadow:0 2px 0 #0007}
.banner.an{animation:pop .45s var(--ad,0s) both}
/* Kategorien-Duell */
.jboard{flex:1;display:grid;gap:10px;min-height:0}
.jh{background:#0d0820e6;border:2px solid #5a3aa6;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;line-height:1;padding:8px 6px 4px}
.jv{background:linear-gradient(180deg,#3b2a8f,#22165a);border:2px solid #7c5cff66;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--gold);text-shadow:0 3px 0 #0008;transition:transform .15s,border-color .15s;padding-top:6px}
.jv.used{background:#0d082066;border-color:#ffffff10;color:transparent;text-shadow:none}
.jv.click:hover{transform:scale(1.07);border-color:var(--gold)}
.jq{flex:1;min-height:0;background:linear-gradient(180deg,#3b2a8f,#1a1048);border:3px solid #7c5cff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 40px;box-shadow:0 20px 60px #000a}
.jq.an{animation:zoomin .55s cubic-bezier(.2,.9,.3,1.15) var(--ad,0s) both}
.jq .cat{font-size:34px;color:#ffffffaa}.jq .val{font-size:84px;color:var(--gold);line-height:1}
.jq .qq{font-size:44px;font-weight:800;line-height:1.2;margin-top:12px}
.jq .aa{margin-top:20px;font-size:38px;font-weight:800;background:var(--good);color:#00281a;padding:6px 26px;border-radius:14px}
.jq .aa.an,.jq .banner.an{animation:pop .45s var(--ad,0s) both}
/* Der Schlauste bleibt */
.ddfgrid{position:absolute;left:40px;right:40px;top:34px;display:grid;gap:24px;justify-content:center}
.ddfbottom{position:absolute;left:40px;right:40px;bottom:28px;display:flex;gap:22px;align-items:flex-end}
.ddfbottom .qcol{flex:1;display:flex;flex-direction:column;gap:10px}
.ddfbottom .hostslot{width:360px}
.qwho{font-size:36px;color:var(--gold);text-align:center;line-height:1}
/* Effekte */
.timerspot{display:none;align-items:center;justify-content:center;gap:8px;background:#000c;border:3px solid var(--gold);border-radius:12px;padding:4px 18px 0;font-size:48px;line-height:1.05;min-width:110px;color:#fff}
.timerspot.on{display:inline-flex}.timerspot.low{color:var(--bad);border-color:var(--bad);animation:tpulse 1s infinite}
.timerspot::before{content:'⏱';font-size:30px;margin-top:-4px}
@keyframes tpulse{50%{transform:scale(1.08)}}
.toprow{display:flex;align-items:center;justify-content:center;gap:18px;flex:none;min-height:30px}
.jq .timerspot{margin-bottom:10px}

}

function parseJeo(t) {

  /* ---------- Spiel-Logik ---------- */

            const q = S.pending.find(x => x.id === m.pid);

            cid2pid.set(cid, m.pid);
            net.send(cid, {t: 'pending'}); net.send(cid, {t: 'state', s: buildPub()});
            renderPlayers(); return;
          }
          p = {id: m.pid, name, team: null, online: true, cam: false}; S.players.push(p); toast(name + ' ist beigetreten');
        }

      if (SND.ver && Object.keys(SND.data).length) net.send(cid, soundsMsg());

    }

      const pid = cid2pid.get(cid); const p = S.players.find(x => x.id === pid); if (!p) return;
      const g = S.game;

    if (g.phase === 'over') q = `<div class="qbar disp" style="font-size:60px" data-an="dover">🏆 ${g.winner ? esc(pname(P, g.winner)) + ' GEWINNT!' : 'SPIEL VORBEI'}</div>`;
    const gh = rows * w * 9 / 16 + (rows - 1) * 24, gtop = 34 + Math.max(0, (1080 - 34 - 270 - gh) / 2);
    return `<div class="ddfgrid" style="grid-template-columns:repeat(${cols},${w}px);top:${gtop}px">${slots}</div><div class="ddfbottom"><div class="qcol"><div class="toprow" style="min-height:0"><div class="timerspot disp"></div></div>${q}</div>${hostSlot()}</div>`;
  }

  /* --- Rendern + Animationen --- */
  function render() {
    if (!P) {
      stage.classList.add('bg');
      ui.innerHTML = `<div class="lobbygrid">${logoHTML('QUIZ SHOW')}<div style="font-size:28px;color:#ffffffaa">${status === 'nohost' ? 'Host-Panel ist nicht geöffnet' : 'Verbinde…'}</div></div>`;
      return;
    }
    stage.classList.toggle('bg', !!opt.alwaysBg || P.settings.bg !== 'transparent');
    const g = P.g;
    const before = new Map(); $$('[data-flip]', ui).forEach(el => before.set(el.dataset.flip, el.getBoundingClientRect()));
    let html = !g ? vLobby() : g.type === 'feud' ? vFeud(g) : g.type === 'ddf' ? vDdf(g) : vJeo(g);
    if (status !== 'online' && !me) html += `<div class="ovhint">⚠ ${status === 'nohost' ? 'Host offline' : 'verbinde…'}</div>`;
    ui.innerHTML = html;
    const now = performance.now();
    $$('[data-an]', ui).forEach(el => {
      const k = el.dataset.an; let t = seen.get(k);
      if (t == null) { t = firstRender ? -1e9 : now; seen.set(k, t); }
      const e = now - t; if (e < 1600) { el.classList.add('an'); el.style.setProperty('--ad', -e + 'ms'); }
    });
    $$('[data-flip]', ui).forEach(el => {
      const b = before.get(el.dataset.flip); if (!b || el.classList.contains('an')) return;
      const r = el.getBoundingClientRect(); if (!r.width) return;
      const dx = (b.left - r.left) / scale, dy = (b.top - r.top) / scale, sx = b.width / r.width;
      if (Math.abs(dx) < 2 && Math.abs(dy) < 2 && Math.abs(sx - 1) < .02) return;
      el.style.transition = 'none'; el.style.transform = `translate(${dx}px,${dy}px) scale(${sx})`;
      el.getBoundingClientRect();
      el.style.transition = 'transform .65s cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
    });
    $$('[data-count]', ui).forEach(el => {
      const k = el.dataset.count, v = +el.dataset.v; let c = counts.get(k);
      if (!c || firstRender) { c = {v, from: v, to: v, t0: 0}; counts.set(k, c); }
      else if (c.to !== v) { c.from = c.v; c.to = v; c.t0 = now; }
      c.el = el; el.textContent = Math.round(c.v);
    });
    doFlash();
    updTimer();
    firstRender = false;
  }
  function doFlash() {
    const f = P.flash; if (!f || f.id === lastFlash) return; lastFlash = f.id; if (f.age > 3000) return;
    const add = (h, ms) => { const d = document.createElement('div'); d.innerHTML = h; const el = d.firstElementChild; fx.appendChild(el); setTimeout(() => el.remove(), ms); };
    const tc = f.team != null && P.teams[f.team] ? P.teams[f.team].color : null;
    if (f.kind === 'x') add(`<div class="bigx">${'<span>✕</span>'.repeat(f.n || 1)}</div>`, 1700);
    if (f.kind === 'text') add(`<div class="flashtxt disp" style="${tc ? `color:${f.bad ? 'var(--bad)' : tc}` : ''}">${esc(f.text)}</div>`, 1900);
    if (f.kind === 'buzz') add(`<div class="flashtxt disp" style="color:${tc || 'var(--gold)'}">${f.pid ? esc(pname(P, f.pid)) : esc(P.teams[f.team] ? P.teams[f.team].name : '')}!</div>`, 1900);
    if (f.kind === 'title') { add('<div class="fxdim"></div>', 2800); add(`<div class="titlecard disp">${esc(f.text)}</div>`, 2800); }
    if (f.kind === 'win') { add(`<div class="flashtxt long disp">${esc(f.text)}</div>`, 4600); confettiIn(fx); }
  }
  function placeCams() {
    const sr = stage.getBoundingClientRect(); const ids = new Set();
    ui.querySelectorAll('[data-cam]').forEach(el => {
      const id = el.dataset.cam; if (!id) return; ids.add(id);
      let w = camEls.get(id);
      if (!w) { w = document.createElement('div'); w.className = 'camwrap'; w.innerHTML = `<iframe allow="autoplay;fullscreen" src="${camViewUrl(camSid(room, id), low)}"></iframe>`; camlayer.appendChild(w); camEls.set(id, w); }
      const r = el.getBoundingClientRect();
      const css = `left:${(r.left - sr.left) / scale}px;top:${(r.top - sr.top) / scale}px;width:${r.width / scale}px;height:${r.height / scale}px;display:block`;
      if (w._css !== css) { w.style.cssText = css; w._css = css; }
    });
    camEls.forEach((w, id) => { if (!ids.has(id) && w._css !== 'display:none') { w.style.cssText = 'display:none'; w._css = 'display:none'; } });
  }
  function tickCounts() {
    const now = performance.now();
    counts.forEach(c => { if (c.v === c.to) return; const p = Math.min(1, (now - c.t0) / 900); const e = 1 - Math.pow(1 - p, 3); c.v = p >= 1 ? c.to : c.from + (c.to - c.from) * e; if (c.el && c.el.isConnected) c.el.textContent = Math.round(c.v); });
  }
  (function loop() { placeCams(); tickCounts(); requestAnimationFrame(loop); })();
  function updTimer() {
    const t = timerText();
    const timerEl = ui.querySelector('.timerspot');
    if (t == null) { if (timerEl) timerEl.classList.remove('on', 'low'); lastTick = null; return; }
    if (timerEl) { timerEl.classList.add('on'); if (timerEl.textContent !== String(t)) timerEl.textContent = t; timerEl.classList.toggle('low', t <= 5); }
    if (!opt.silent && t <= 5 && t > 0 && t !== lastTick) playSfx('tick'); lastTick = t;
  }
  setInterval(updTimer, 100);
  render();
  return {update(p) { P = p; render(); }, setStatus(s) { if (s !== status) { status = s; render(); } }, rerender: render};
}

/* =====================================================================
   CLIENT-Zustand
   ===================================================================== */
let PUB = null, timerEnd = null;
function applyState(s) { PUB = s; if (s.settings && s.settings.sfx) SFXCFG = s.settings.sfx; timerEnd = s.timer.rem != null ? Date.now() + s.timer.rem : null; }
function timerText() { if (!timerEnd) return null; return Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000)); }

/* ---------------- Spieler ---------------- */
function startPlayer() {
  const room = (PARAMS.play || '').toUpperCase();
  let pid = store.sget('dqs-pid-' + room); if (!pid) { pid = 'p' + rid(9); store.sset('dqs-pid-' + room, pid); }
  let name = store.sget('dqs-name-' + room) || '';
  let camOn = store.sget('dqs-cam-' + room) === '1';
  if (PARAMS.k) store.sset('dqs-key-' + room, PARAMS.k);
  const key = PARAMS.k || store.sget('dqs-key-' + room) || '';
  let gate = null;
  soundOn = true; masterVol = store.get('dqs-pvol', 0.6);
  let net = null, status = 'connecting', myVote = null, stage = null, camOpen = false;
  const hello = () => ({t: 'hello', role: 'player', pid, name, cam: camOn, key});
  const send = (a, extra = {}) => net && net.send(Object.assign({t: 'act', a}, extra));

  function joinScreen() {
    document.body.className = 'player';
    $('#app').innerHTML = `<div class="landing"><div class="logo">Quiz<span>show</span></div><p class="muted">Raum <b style="color:var(--gold)">${esc(room)}</b></p>
      <div class="card"><h2>Wie heißt du?</h2><div class="row"><input id="nm" class="grow" maxlength="24" placeholder="Dein Streamer-Name" value="${esc(store.get('dqs-lastname', ''))}"><button class="b-gold" id="go">Beitreten</button></div></div></div>`;
    const go = () => { const v = $('#nm').value.trim(); if (!v) return; name = v; store.sset('dqs-name-' + room, v); store.set('dqs-lastname', v); ac(); main(); };
    $('#go').onclick = go; $('#nm').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#nm').focus();
  }
  function main() {
    document.body.className = 'pl';
    $('#app').innerHTML = `<div class="plwrap"><div class="plstage" id="plstage"></div><div class="pbar" id="pbar"></div></div>
      <div class="card campop ${camOpen ? '' : 'hide'}" id="campop"><div class="row"><h3 class="grow" style="margin:0">Deine Kamera</h3><button id="camBtn"></button><button class="b-ghost" data-bact="camClose">✕</button></div>
      <p class="muted" style="font-size:14px;margin:8px 0 0" id="camHint"></p><div id="camBox"></div></div>`;
    stage = createStage($('#plstage'), {room, me: pid, low: true, alwaysBg: true, getVote: () => myVote, onAct: (a, d) => {
      if (a === 'vote') { myVote = d.target; send('vote', {target: d.target}); stage.rerender(); renderBar(); }
      if (a === 'pick') send('pick', {c: +d.c, r: +d.r});
    }});
    $('#camBtn').onclick = () => { camOn = !camOn; store.sset('dqs-cam-' + room, camOn ? '1' : ''); renderCam(); send('cam', {on: camOn}); renderBar(); };
    renderCam(); renderBar();
    clientTransport(room, {
      hello,
      onStatus: s => { if (s !== status) { status = s; renderBar(); } },
      onMsg: m => {
        if (m.t === 'denied') { gate = m.why; renderBar(); return; }
        if (m.t === 'pending') { gate = 'pending'; renderBar(); return; }
        if (m.t === 'state') { if (m.s.players.some(p => p.id === pid)) gate = null; applyState(m.s); if (!m.s.g || m.s.g.type !== 'ddf' || m.s.g.phase !== 'vote') myVote = null; stage.update(m.s); renderBar(); }
        if (m.t === 'sfx') playSfx(m.n);
        if (m.t === 'sounds') setCustomSounds(m.data, m.ver);
      }
    }).then(n => net = n).catch(err => toast(err.message));
    setInterval(() => { const el = $('#ptimer'); if (el) { const t = timerText(); el.textContent = t == null ? '' : '⏱ ' + t; } }, 250);
  }
  function renderCam() {
    const sid = camSid(room, pid);
    $('#camBtn').textContent = camOn ? 'Kamera beenden' : 'Kamera starten';
    $('#camBtn').className = camOn ? 'b-ghost' : 'b-gold';
    $('#camHint').innerHTML = camOn ? `Kamera auswählen und auf „Start“ klicken. Danach kannst du dieses Fenster schließen – die Cam läuft weiter. <a href="${camPushUrl(sid, name)}" target="_blank" rel="noopener">In eigenem Tab öffnen</a>` : 'Deine Cam erscheint im Overlay und bei allen Mitspielern. Ohne Ton – geredet wird im Discord.';
    const box = $('#camBox');
    if (camOn && !box.querySelector('iframe')) box.innerHTML = `<iframe allow="camera;microphone;autoplay;display-capture;fullscreen" src="${camPushUrl(sid, name)}"></iframe>`;
    if (!camOn) box.innerHTML = '';
  }
  const meP = () => PUB && PUB.players.find(p => p.id === pid);
  const tTag = t => t == null ? '' : `<b style="color:${PUB.teams[t].color};filter:brightness(1.3)">${esc(PUB.teams[t].name)}</b>`;
  function midHTML() {
    if (gate === 'pending') return `<span class="msg">⏳ Warte auf Freigabe durch den Host…</span>`;
    if (gate === 'key') return `<span class="msg" style="color:var(--bad)">⛔ Ungültiger oder alter Link – frag den Host nach dem aktuellen Spieler-Link.</span>`;
    if (gate === 'locked') return `<span class="msg" style="color:var(--bad)">🔒 Die Lobby ist gerade gesperrt.</span>`;
    if (gate === 'rejected') return `<span class="msg" style="color:var(--bad)">⛔ Der Host hat dich nicht zugelassen.</span>`;
    if (!PUB) return `<span class="msg muted">Verbinde mit dem Host…</span>`;
    const g = PUB.g, m = meP();
    if (!m) return `<span class="msg muted">Melde mich beim Host an…</span>`;
    if (!g) return `<span class="msg">Du bist drin! 🎉 Warte, bis der Host startet.</span>`;
    if (g.type === 'feud') {
      const amB = m.team != null && g.buzzers[m.team] === pid;
      if (amB && g.phase === 'buzz') return `<button class="bigbuzz" style="--tc:${PUB.teams[m.team].color}" data-bact="buzz">BUZZER · LEERTASTE</button>`;
      if (amB && g.phase === 'intro') return `<button class="bigbuzz" disabled style="--tc:#555">DU BIST AM BUZZER…</button>`;
      const who = g.buzzWinner ? esc(pname(PUB, g.buzzWinner)) : '';
      const t = {intro: 'Gleich geht’s los…', buzz: 'Buzzer offen!', faceoff: `${tTag(g.turn)} ist dran${who ? ' (' + who + ')' : ''}`, play: `${tTag(g.control)} zählt auf · Fehler ${g.strikes}/3`, steal: `${tTag(g.turn)} darf klauen – ein Versuch!`, done: g.awarded != null ? `${tTag(g.awarded)} bekommt ${g.pot} Punkte` : 'Runde vorbei', over: 'Spiel vorbei!'}[g.phase];
      return `<span class="msg">${t}</span>`;
    }
    if (g.type === 'ddf') {
      if (!(pid in g.lives)) return `<span class="msg">Du schaust zu 👀</span>`;
      const alive = g.lives[pid] > 0;
      if (g.phase === 'vote' && alive) {
        const others = g.order.filter(id => g.lives[id] > 0 && id !== pid);
        return `<span class="msg" style="font-size:18px">🗳 Wer soll ein Herz verlieren? <small class="muted">(anonym)</small></span>` + others.map(id => `<button class="vchip ${myVote === id ? 'on' : ''}" data-bact="vote" data-target="${id}">${esc(pname(PUB, id))}</button>`).join('') + `<span class="muted" style="font-size:13px;width:100%;text-align:center">…oder klick oben direkt auf die Cam · änderbar bis zur Auflösung</span>`;
      }
      if (!alive && g.phase !== 'over') return `<span class="msg" style="color:var(--bad)">Du bist raus 💀</span>`;
      const t = {intro: 'Gleich startet die nächste Runde', ask: g.cur && g.cur.pid === pid ? '👉 Du bist dran!' : `${esc(pname(PUB, g.cur ? g.cur.pid : ''))} ist dran`, judged: g.cur && g.cur.pid === pid ? (g.cur.ok ? '✅ Richtig!' : '❌ Falsch!') : `${esc(pname(PUB, g.cur ? g.cur.pid : ''))} ist dran`, vote: 'Abstimmung läuft…', tally: '🗳 Auswertung läuft – der Host deckt auf…', tie: 'Gleichstand – der Host entscheidet', reveal: g.loser === pid ? 'Du verlierst ein Herz 💔' : `${esc(pname(PUB, g.loser))} verliert ein Herz`, over: g.winner === pid ? '🏆 Du hast gewonnen!' : `🏆 ${esc(pname(PUB, g.winner))} gewinnt!`}[g.phase];
      return `<span class="msg">${t}</span>`;
    }
    if (g.type === 'jeo') {
      if (m.team == null) return `<span class="msg">Du bist in keinem Team</span>`;
      if (g.phase === 'board') return `<span class="msg">${g.pickTeam === m.team ? '👉 Dein Team wählt – klick oben auf eine Karte!' : tTag(g.pickTeam) + ' wählt eine Karte…'}</span>`;
      if (g.phase === 'stealOffer') return m.team === 1 - g.pickTeam
        ? `<span class="msg">Falsch! Nachziehen? <small class="muted">(falsch = Abzug)</small></span><button class="b-gold b-big" data-bact="steal">Nachziehen!</button><button class="b-big" data-bact="pass">Verzichten</button>`
        : `<span class="msg">Falsch! ${tTag(1 - g.pickTeam)} überlegt…</span>`;
      if (g.phase === 'question' || g.phase === 'steal') return `<span class="msg">${g.answerTeam === m.team ? '👉 Dein Team antwortet!' : tTag(g.answerTeam) + ' antwortet…'}</span>`;
      if (g.phase === 'answer') return `<span class="msg">${g.result && g.result.team != null ? tTag(g.result.team) + ' ' + (g.result.delta > 0 ? '+' : '') + g.result.delta : 'Keine Punkte'}</span>`;
      return `<span class="msg">Spiel vorbei!</span>`;
    }
    return '';
  }
  function renderBar() {
    const el = $('#pbar'); if (!el) return; const m = meP(); const g = PUB && PUB.g;
    const t = m && m.team != null && PUB.teams[m.team] ? PUB.teams[m.team] : null;
    const hearts = g && g.type === 'ddf' && pid in g.lives ? heartsHTML(g.lives[pid], g.max) : '';
    el.innerHTML = `<div class="me"><div class="row"><span class="dot ${status === 'online' ? 'on' : ''}"></span><b>${esc(name)}</b></div><div class="row">${t ? `<span class="pill" style="background:${t.color};color:#fff">${esc(t.name)}</span>` : ''}<span style="font-size:18px">${hearts}</span>${status !== 'online' ? `<span class="muted" style="font-size:13px">${status === 'nohost' ? 'Host offline…' : 'verbinde…'}</span>` : ''}</div></div>
      <div class="mid">${midHTML()}</div>
      <div class="side"><b id="ptimer" style="font-size:26px;color:var(--gold);min-width:60px"></b>
      <button data-bact="fs" class="b-ghost" title="Overlay im Vollbild">⛶ Vollbild</button>
      <button data-bact="cam" class="${camOn ? '' : 'b-gold'}">${camOn ? '📷 Cam an' : '📷 Cam starten'}</button>
      <label class="row muted" title="Lautstärke">🔊<input type="range" min="0" max="100" value="${Math.round(masterVol * 100)}" id="vol" style="width:90px"></label></div>`;
    $('#vol').oninput = e => { masterVol = e.target.value / 100; store.set('dqs-pvol', masterVol); };
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-bact]'); if (!b || b.disabled) return; const d = b.dataset;
    if (d.bact === 'buzz') { send('buzz'); b.disabled = true; }
    if (d.bact === 'vote') { myVote = d.target; send('vote', {target: d.target}); renderBar(); stage && stage.rerender(); }
    if (d.bact === 'steal' || d.bact === 'pass') send(d.bact);
    if (d.bact === 'cam') { camOpen = !camOpen; $('#campop').classList.toggle('hide', !camOpen); }
    if (d.bact === 'fs') { const el = $('#plstage'); if (document.fullscreenElement) document.exitFullscreen(); else if (el && el.requestFullscreen) el.requestFullscreen().catch(() => {}); }
    if (d.bact === 'camClose') { camOpen = false; $('#campop').classList.add('hide'); }
  });
  addEventListener('keydown', e => {
    if (e.code !== 'Space' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const b = document.querySelector('[data-bact="buzz"]:not([disabled])'); if (b) { e.preventDefault(); b.click(); }
  });
  name ? main() : joinScreen();
}

/* ---------------- Overlay ---------------- */
function startOverlay() {
  const room = (PARAMS.overlay || '').toUpperCase();
  document.body.className = 'ov';
  masterVol = 1;
  $('#app').innerHTML = '<div id="ovwrap" style="position:fixed;inset:0"></div>';
  const st = createStage($('#ovwrap'), {room});
  clientTransport(room, {
    hello: () => ({t: 'hello', role: 'overlay'}),
    onStatus: s => st.setStatus(s),
    onMsg: m => { if (m.t === 'state') { applyState(m.s); st.update(m.s); } if (m.t === 'sfx') playSfx(m.n); if (m.t === 'sounds') setCustomSounds(m.data, m.ver); }
  }).catch(err => toast(err.message));
}

/* ---------------- Startseite ---------------- */
function startLanding() {
  $('#app').innerHTML = `<div class="landing"><div class="logo">Quiz<span>show</span></div><p class="muted">Team-Duell · Der Schlauste bleibt · Kategorien-Duell</p>
    <div class="card"><h2>Mitspielen</h2><p class="muted" style="margin:0">Zum Mitspielen brauchst du den Spieler-Link vom Host. Frag im Discord danach.</p></div>
    </div>`;
}

function hostGate() {
  if (!HOST_PASS_HASH || store.get('dqs-auth', '') === HOST_PASS_HASH) return startHost();
  $('#app').innerHTML = `<div class="landing"><div class="logo">Host-<span>Panel</span></div>
    <div class="card"><h2>Passwort</h2><div class="row"><input id="pw" type="password" class="grow" placeholder="Host-Passwort"><button class="b-gold" id="pwgo">Anmelden</button></div>
    <label class="row muted" style="margin-top:10px;font-size:14px"><input type="checkbox" id="pwkeep" checked> Auf diesem Gerät angemeldet bleiben</label></div></div>`;
  const go = async () => {
    const h = await sha256($('#pw').value);
    if (h !== HOST_PASS_HASH) { toast('Falsches Passwort'); $('#pw').select(); return; }
    if ($('#pwkeep').checked) store.set('dqs-auth', h);
    startHost();
  };
  $('#pwgo').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pw').focus();
}
if ('host' in PARAMS) hostGate();
else if (PARAMS.play) startPlayer();
else if (PARAMS.overlay) startOverlay();
else startLanding();
</script>
</body>
</html>
